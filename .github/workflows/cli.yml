name: CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :cli:test :cli:installDist :cli:distTar
      - run: cli/build/install/dzienniczek/bin/dzienniczek capabilities --json --compact
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dzienniczek-jvm-distribution
          path: cli/build/distributions/dzienniczek-*.tar.gz
